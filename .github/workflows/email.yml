name: github-action-email
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: CheckoutRepo
        uses: actions/checkout@v2
      # 获取dev分支上最新一条提交的git log
      - name: GetLastLog
        id: git_log
        uses: Edisonboy/latest-git-log-action@main
        with:
          tag: origin/dev
      # 发送邮件
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{secrets.userInfo.USER_NAME}}
          password: ${{secrets.userInfo.EMAIL_PASSWORD}}
          subject: Github操作作业结果
          to: ${{secrets.userInfo.EMAIL}}
          from: ${{secrets.userInfo.USER_NAME}}
          body: '仓库名称：school_project push log : ${{ steps.git_log.outputs.log }}'
